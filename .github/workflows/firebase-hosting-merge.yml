# Every push to master: run CI, then deploy the game (Hosting), the world
# creator's functions and the Firestore rules and indexes to dinos-adventure,
# then check the callable functions are still public.
#
# Needs these repository secrets:
#   FIREBASE_SERVICE_ACCOUNT_DINOS_ADVENTURE  a service account key with deploy
#                                              roles (see functions/README.md)
#   APP_ENV                                   the contents of .env (see .env.example)
# and the ANTHROPIC_API_KEY function secret set once in the project.
name: Deploy to Firebase on merge

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://dino.spanion.in
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            functions/pnpm-lock.yaml

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir functions install --frozen-lockfile

      - name: Write .env
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          if [ -z "$APP_ENV" ]; then
            echo "::error::The APP_ENV secret is empty. Set it to the contents of .env (see .env.example)."
            exit 1
          fi
          printf '%s\n' "$APP_ENV" > .env

      - name: Build
        env:
          REQUIRE_FIREBASE_ENV: "1"
        run: pnpm build

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DINOS_ADVENTURE }}

      # npx, not `pnpm dlx`: inside this repo pnpm dlx applies the workspace
      # overrides (pnpm-workspace.yaml) to firebase-tools too, which put
      # minimatch 11 under its glob 10, so Hosting found 0 files in dist and
      # released an empty site while the run stayed green.
      - name: Deploy
        run: >
          npx --yes firebase-tools@15
          deploy --project dinos-adventure
          --only hosting,functions,firestore:rules,firestore:indexes
          --non-interactive --force
          --message "${{ github.sha }}"

      - name: Callable functions are public
        run: node scripts/check-functions-public.js

      # a deploy that uploads nothing still "succeeds": fail if the game is gone
      - name: The site serves the game
        run: |
          for file in / /bundle.js /manifest.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://dinos-adventure.web.app$file")
            echo "$file $code"
            if [ "$code" != "200" ]; then
              echo "::error::https://dinos-adventure.web.app$file returned $code after the deploy"
              exit 1
            fi
          done
