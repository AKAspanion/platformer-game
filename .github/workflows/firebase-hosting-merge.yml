# Every push to master: run CI, then deploy the game (Hosting), the world
# creator's functions and the Firestore rules and indexes to dinos-adventure.
#
# Needs the FIREBASE_SERVICE_ACCOUNT_DINOS_ADVENTURE secret (a service
# account key with deploy roles, see functions/README.md) and the
# ANTHROPIC_API_KEY function secret set once in the project.
name: Deploy to Firebase on merge

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dino.spanion.in
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            functions/pnpm-lock.yaml

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir functions install --frozen-lockfile

      - name: Build
        run: pnpm build

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DINOS_ADVENTURE }}

      - name: Deploy
        run: >
          pnpm dlx firebase-tools@15
          deploy --project dinos-adventure
          --only hosting,functions,firestore:rules,firestore:indexes
          --non-interactive --force
          --message "${{ github.sha }}"

      # a lost invoker permission shows as a 403 before any player sees it
      - name: Check the functions are public
        run: node scripts/check-functions-public.js https://asia-south1-dinos-adventure.cloudfunctions.net
