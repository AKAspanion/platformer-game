# Lint, tests and a production build for every pull request. The deploy
# workflow (firebase-hosting-merge.yml) runs this too before it deploys.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            functions/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Functions share the game's world validation
        run: node scripts/sync-functions-shared.js --check

      - name: Functions load
        run: |
          pnpm --dir functions install --frozen-lockfile
          pnpm --dir functions check

      - name: Build
        run: pnpm build
