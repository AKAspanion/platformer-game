# Lint, tests and a production build for every pull request. The deploy
# workflow (firebase-hosting-merge.yml) runs this too before it deploys.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Tests
        run: yarn test

      - name: Functions share the game's world validation
        run: node scripts/sync-functions-shared.js --check

      - name: Functions load
        run: |
          npm ci --prefix functions
          npm run check --prefix functions

      - name: Build
        run: yarn build
