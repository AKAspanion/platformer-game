# Lint, format, tests, dependency audit, a production build and the end-to-end
# tests (Playwright, against the Firebase emulators) for every pull
# request. The deploy workflow (firebase-hosting-merge.yml) runs this too, and
# deploys only when every job here passed.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            functions/pnpm-lock.yaml

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir functions install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      # the Firestore emulator needs Java
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Firestore rules
        run: pnpm test:rules

      - name: Functions share the game's world validation
        run: node scripts/sync-functions-shared.js --check

      - name: Functions load
        run: pnpm --dir functions check

      - name: Dependency audit
        run: pnpm audit:all

      # No .env here: the build plays offline, which is all the checks need.
      - name: Build
        run: pnpm build

  # The game in real browsers: a production build against the Firebase
  # emulators (demo project, no secrets), driven by Playwright (e2e/).
  e2e:
    name: End-to-end (Playwright, Chromium + WebKit, emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            functions/pnpm-lock.yaml

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir functions install --frozen-lockfile

      # the Firestore emulator needs Java
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      # playwright.config.js starts the emulators and the game itself
      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
