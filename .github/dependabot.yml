# Weekly dependency updates, grouped so each ecosystem opens one PR for minor
# and patch bumps. Majors arrive one PR each. Security updates are separate
# and immediate once Dependabot security updates are enabled for the repo.
# Third-party Actions are pinned to commit SHAs (with the version in a comment);
# Dependabot updates the SHA and the comment together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      game-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      functions-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps-functions)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
